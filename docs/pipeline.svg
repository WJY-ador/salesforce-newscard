      <title id="pipeline-title">NewsCard 파이프라인</title>
      <desc id="pipeline-desc">소스 수집 후보로 사람이 카드 브리프를 쓰면 코드가 브리프를 검증하고 이미지 프롬프트를 조립하며, 외부 이미지 모델이 만든 PNG를 코드가 4:5 판형에 맞추고 실물 로고를 합성한 뒤, 사람이 교정과 판형 실물 확인을 거친 카드만 발송 이력과 대조해 같은 PNG 하나로 Slack과 Instagram에 보내는 흐름이다.</desc>
