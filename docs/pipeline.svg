<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1648 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
      <title id="pipeline-title">NewsCard 파이프라인</title>
      <desc id="pipeline-desc">코드가 공식 릴리스 노트와 기준 org의 Release Update를 수집하면 사람이 카드에 실을 항목을 판별해 브리프를 쓰고, 브리프로 카드를 렌더해 로고를 합성하고 사람이 실물을 확인한 뒤 발송 이력과 대조하는 한편, org에 이미 온 항목은 코드가 기준 org의 해당 Setup 화면을 찾아 봐야 할 자리에 빨간 테두리를 친 캡처로, 아직 오지 않은 예고 항목은 문서 문단 캡처로 증거를 만들어 발송 때 카드 뒤에 첨부해 Slack과 Instagram에 보내는 흐름이다.</desc>
